[custom.hostname]
command = '''
if [ -f /run/.containerenv ]; then
    # Vytáhneme jméno ze souboru .containerenv
    BOX_NAME=$(grep -oP '^name="\K[^"]+' /run/.containerenv 2>/dev/null)

    # Pokud jsme v Toolboxu, jmenuje se to "oci", tak to natvrdo změníme na "toolbx"
    if [ "$BOX_NAME" = "oci" ]; then
        BOX_NAME="toolbx"
    fi

    # Fallback pro jistotu, kdyby proměnná chyběla
    if [ -z "$BOX_NAME" ]; then
        BOX_NAME="box"
    fi

    echo -n "@$BOX_NAME"
else
    CURRENT_HOST=$(hostname)
    MAIN_HOST="fedora"

    if [ "$CURRENT_HOST" != "$MAIN_HOST" ]; then
        echo -n "@$CURRENT_HOST"
    fi
fi
'''
when = "true"
style = "bold magenta"
format = "[$output ]($style)"
