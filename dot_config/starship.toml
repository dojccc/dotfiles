style = "bold yellow"
discharging_symbol = "󰁽 " # nf-md-battery_40
charging_symbol = "󰂈 "    # nf-md-battery_charging_40

# 41% - 50%
[[battery.display]]
threshold = 50
style = "bold green"
discharging_symbol = "󰁾 " # nf-md-battery_50
charging_symbol = "󰢝 "    # nf-md-battery_charging_50

# 51% - 60%
[[battery.display]]
threshold = 60
style = "bold green"
discharging_symbol = "󰁿 " # nf-md-battery_60
charging_symbol = "󰂉 "    # nf-md-battery_charging_60

# 61% - 70%
[[battery.display]]
threshold = 70
style = "bold green"
discharging_symbol = "󰂀 " # nf-md-battery_70
charging_symbol = "󰢞 "    # nf-md-battery_charging_70

# 71% - 80%
[[battery.display]]
threshold = 80
style = "bold green"
discharging_symbol = "󰂁 " # nf-md-battery_80
charging_symbol = "󰂊 "    # nf-md-battery_charging_80

# 81% - 90%
[[battery.display]]
threshold = 90
style = "bold green"
discharging_symbol = "󰂂 " # nf-md-battery_90
charging_symbol = "󰂋 "    # nf-md-battery_charging_90

# 91% - 100%
[[battery.display]]
threshold = 100
style = "bold green"
discharging_symbol = "󰁹 " # nf-md-battery_100
charging_symbol = "󰂄 "    # nf-md-battery_charging_100
