# This forces the OS and User to always show
#format = """
#[ ](bold blue)$battery$username$hostname$directory$git_branch$git_status$python$rust$character
#"""

format = """
$os$username${custom.hostname}$directory$git_branch$git_status$character
"""

# Contextual info on the right
right_format = """
$status$cmd_duration$battery
"""

[battery]
# Global fallback symbols if a threshold isn't met
full_symbol = "󰂄 "
charging_symbol = "󰂄 "
discharging_symbol = " "
format = "[$symbol]($style) "
#format = "[$symbol$percentage]($style) "

# 0% - 10%
[[battery.display]]
threshold = 10
style = "bold red"
discharging_symbol = "󰁺 " # nf-md-battery_10
charging_symbol = "󰢜 "    # nf-md-battery_charging_10

# 11% - 20%
[[battery.display]]
threshold = 20
style = "bold red"
discharging_symbol = "󰁻 " # nf-md-battery_20
charging_symbol = "󰂆 "    # nf-md-battery_charging_20

# 21% - 30%
[[battery.display]]
threshold = 30
style = "bold yellow"
discharging_symbol = "󰁼 " # nf-md-battery_30
charging_symbol = "󰂇 "    # nf-md-battery_charging_30

# 31% - 40%
[[battery.display]]
